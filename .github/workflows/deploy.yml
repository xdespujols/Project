name: Deploy worker to CapRover

# The web app (plane-web) is deployed automatically by CapRover's
# native GitHub integration (Method 3) via a webhook.
# This workflow only handles the worker, which needs a different Dockerfile.

on:
  push:
    branches: [main]

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Build worker tarball
        run: |
          # Copy full build context, swap Dockerfile.worker → Dockerfile,
          # and add a captain-definition so CapRover knows what to build.
          cp -r . /tmp/caprover-worker
          cd /tmp/caprover-worker
          cp Dockerfile.worker Dockerfile
          printf '{"schemaVersion":2,"dockerfilePath":"./Dockerfile"}' > captain-definition
          tar -czf /tmp/worker.tar.gz .

      - name: Deploy worker → CapRover
        run: |
          curl -fsSL -X POST \
            "${{ secrets.CAPROVER_URL }}/api/v2/user/apps/appData/plane-worker" \
            -H "x-captain-auth: ${{ secrets.CAPROVER_APP_TOKEN_WORKER }}" \
            -F "sourceFile=@/tmp/worker.tar.gz" \
            -F "gitHash=${{ github.sha }}"
